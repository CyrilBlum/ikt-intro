server {
    listen 80;
    listen [::]:80;

    server_name ikt.in-form-atik.ch;
    root /mnt/HC_Volume_100926434/www/ikt.in-form-atik.ch/public_html;
    index index.html;

    access_log /var/log/nginx/ikt.access.log;
    error_log  /var/log/nginx/ikt.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /mnt/HC_Volume_100926434/www;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|pdf|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
