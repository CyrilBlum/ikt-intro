server {
    listen 80;
    listen [::]:80;
    server_name ikt.in-form-atik.ch;

    location ^~ /.well-known/acme-challenge/ {
        root /mnt/HC_Volume_100926434/www;
        default_type text/plain;
    }

    location / {
        return 301 https://ikt.in-form-atik.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ikt.in-form-atik.ch;

    root /mnt/HC_Volume_100926434/www/ikt.in-form-atik.ch/public_html;
    index index.html;

    access_log /var/log/nginx/ikt.access.log;
    error_log  /var/log/nginx/ikt.error.log;

    ssl_certificate     /etc/letsencrypt/live/ikt.in-form-atik.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikt.in-form-atik.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Freie Räume für Lehrpersonen (Seite und Daten vom Dienst infomonitor.service)
    location = /raeume {
        proxy_pass http://127.0.0.1:8790/raeume;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location = /infomonitor/raeume {
        return 301 /raeume;
    }

    # Infomonitor FDU (Dienst infomonitor.service, 127.0.0.1:8790)
    location = /infomonitor {
        return 301 /infomonitor/;
    }

    location ^~ /infomonitor/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Editor der Anleitungen (Tab im Admin-Portal des Infomonitors)
    location = /admin {
        return 302 /infomonitor/admin#anleitungen;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|pdf|pkg|zip|sh|docx)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
