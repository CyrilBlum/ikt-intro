server {
    listen 80;
    listen [::]:80;
    server_name ikt.in-form-atik.ch;

    location ^~ /.well-known/acme-challenge/ {
        root /mnt/HC_Volume_100926434/www;
        default_type text/plain;
    }

    location / {
        return 301 https://ikt.in-form-atik.ch$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ikt.in-form-atik.ch;

    root /mnt/HC_Volume_100926434/www/ikt.in-form-atik.ch/public_html;
    index index.html;

    access_log /var/log/nginx/ikt.access.log;
    error_log  /var/log/nginx/ikt.error.log;

    ssl_certificate     /etc/letsencrypt/live/ikt.in-form-atik.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikt.in-form-atik.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
